<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frost Flashcard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <select id="deck-select" aria-label="Deck"></select>
  </header>

  <nav>
    <button data-view="review" aria-selected="true">Review</button>
    <button data-view="add" aria-selected="false">Add</button>
    <button data-view="words" aria-selected="false">Words</button>
    <button data-view="decks" aria-selected="false">Decks</button>
  </nav>

  <section id="view-review">
    <div class="row">
      <select id="filter" aria-label="Which cards to review">
        <option value="due">Due today</option>
        <option value="all">All cards</option>
        <option value="new">New</option>
        <option value="learning">Learning</option>
        <option value="known">Known</option>
      </select>
      <span id="remaining" class="meta"></span>
    </div>
    <p id="stats" class="meta"></p>
    <button id="card" type="button">
      <span id="card-front" dir="auto"></span>
      <span id="card-reading" dir="auto"></span>
      <span id="card-back" dir="auto"></span>
    </button>
    <p id="hint" class="meta">Click the card or press Space to show the answer</p>
    <div id="grades" hidden>
      <button data-grade="again">1 Again</button>
      <button data-grade="hard">2 Hard</button>
      <button data-grade="good">3 Good</button>
      <button data-grade="easy">4 Easy</button>
    </div>
    <p id="done" class="meta" hidden></p>
  </section>

  <section id="view-add" hidden>
    <form id="add-form">
      <label>Word <input name="front" dir="auto" autocomplete="off" required></label>
      <label>Reading (optional) <input name="reading" dir="auto" autocomplete="off"></label>
      <label>Meaning <input name="back" dir="auto" autocomplete="off" required></label>
      <button type="submit">Add card</button>
    </form>
    <p id="card-count" class="meta"></p>
    <button id="import" type="button">Import from Excel / CSV…</button>
    <p class="meta">First sheet or file: column A = word, B = meaning, C = reading (optional).
      Header rows, blank rows and words already in the deck are skipped.</p>
  </section>

  <section id="view-words" hidden>
    <input id="search" type="search" dir="auto" autocomplete="off" placeholder="Search words">
    <ul id="card-list" class="list"></ul>
  </section>

  <section id="view-decks" hidden>
    <ul id="deck-list" class="list"></ul>
    <form id="new-deck-form" class="row">
      <input name="name" dir="auto" autocomplete="off" placeholder="New deck name" required>
      <button type="submit">Create</button>
    </form>
    <button id="export" type="button">Export this deck to CSV…</button>
  </section>

  <p id="message" role="status"></p>

  <script type="module" src="app.js"></script>
</body>
</html>
